<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gnome Delivery Service</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one screen. Thin sign-board header, the sewer viewport fills the rest, thumb controls dock underneath on touch. */
:root {
  color-scheme: dark;
  --sewer: #10201f;        /* page ground: wet pipe dark */
  --sewer-raised: #1b3331; /* buttons, chips */
  --pipe: #3f6b62;         /* borders, oxidised copper */
  --paper: #f3efe2;        /* toilet-paper white, main text */
  --hat: #d8432f;          /* gnome hat red, the one accent */
  --muted: #8fa9a2;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sewer);
  color: var(--paper);
  font-family: var(--body);
  font-weight: 600;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 16px;
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: 1.25rem;
  letter-spacing: 0.02em;
}
h1 span { color: var(--hat); }
.keys { margin: 0; color: var(--muted); font-size: 0.8rem; }
.keys kbd {
  font: inherit;
  font-weight: 800;
  color: var(--paper);
  background: var(--sewer-raised);
  border: 1px solid var(--pipe);
  border-radius: 4px;
  padding: 0 5px;
}
.stage {
  flex: 1;
  min-height: 0;
  container-type: size;
  display: grid;
  place-items: center;
}
canvas {
  display: block;
  width: min(100cqw, 100cqh * 16 / 9);
  aspect-ratio: 16 / 9;
  max-width: 100%;
  border: 2px solid var(--pipe);
  border-radius: 6px;
  background: #0b1716;
}
.pad { display: none; justify-content: space-between; gap: 16px; }
.pad div { display: flex; gap: 10px; }
.pad button {
  font-family: var(--display);
  font-size: 1.1rem;
  color: var(--paper);
  background: var(--sewer-raised);
  border: 2px solid var(--pipe);
  border-radius: 14px;
  min-width: 64px;
  height: 60px;
  padding: 0 14px;
  touch-action: none;
}
.pad button.on { background: var(--pipe); }
.pad button.whack { border-color: var(--hat); }
.pad button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
@media (pointer: coarse) {
  .pad { display: flex; }
  .keys { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Gnome <span>Delivery</span> Service</h1>
  <p class="keys"><kbd>←</kbd> <kbd>→</kbd> run · <kbd>Space</kbd> jump · <kbd>X</kbd> plunger whack · <kbd>Enter</kbd> continue</p>
</header>
<div class="stage"><canvas id="game" width="960" height="540" aria-label="Gnome Delivery Service game"></canvas></div>
<div class="pad">
  <div>
    <button type="button" id="btn-left" data-key="left" aria-label="Run left">◀</button>
    <button type="button" id="btn-right" data-key="right" aria-label="Run right">▶</button>
  </div>
  <div>
    <button type="button" id="btn-whack" class="whack" data-key="attack">Whack</button>
    <button type="button" id="btn-jump" data-key="jump">Jump</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
