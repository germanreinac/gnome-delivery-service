<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gnome Delivery Service</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one screen. Thin sign-board header, the pipe view fills everything else, thumb controls float over its bottom corners on touch. */
:root {
  color-scheme: dark;
  --sewer: #14181b;        /* page ground: wet pipe dark */
  --sewer-raised: #20272c; /* buttons, chips */
  --pipe: #3a454c;         /* borders, oxidised copper */
  --paper: #f3efe2;        /* toilet-paper white, main text */
  --hat: #d8432f;          /* gnome hat red, the one accent */
  --muted: #8a959c;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sewer);
  color: var(--paper);
  font-family: var(--body);
  font-weight: 600;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 16px;
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: 1.25rem;
  letter-spacing: 0.02em;
}
h1 span { color: var(--hat); }
.keys { margin: 0; color: var(--muted); font-size: 0.8rem; }
.keys kbd {
  font: inherit;
  font-weight: 800;
  color: var(--paper);
  background: var(--sewer-raised);
  border: 1px solid var(--pipe);
  border-radius: 4px;
  padding: 0 5px;
}
.stage {
  flex: 1;
  min-height: 0;
  position: relative;
  border: 2px solid var(--pipe);
  border-radius: 6px;
  overflow: hidden;
  background: #101417;
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#view { filter: contrast(1.07) saturate(0.88); }
#hud { pointer-events: none; }
.pad { display: none; }
.stick, .pad button {
  position: absolute;
  bottom: 18px;
  background: rgba(27, 51, 49, 0.6);
  border: 2px solid var(--pipe);
  color: var(--paper);
  touch-action: none;
}
.stick { left: 18px; width: 124px; height: 124px; border-radius: 50%; }
.stick i {
  position: absolute; left: 50%; top: 50%;
  width: 52px; height: 52px; margin: -26px;
  border-radius: 50%;
  background: var(--paper);
  opacity: 0.85;
}
.pad button {
  font-family: var(--display);
  font-size: 1rem;
  width: 76px; height: 76px;
  border-radius: 50%;
  padding: 0;
}
/* an arc under the right thumb: Whack biggest in the corner, the rest fanned around it */
#btn-whack { right: 18px; bottom: 18px; width: 92px; height: 92px; font-size: 1.15rem; border-color: var(--hat); }
#btn-jump { right: 122px; bottom: 14px; width: 72px; height: 72px; }
#btn-wrap { right: 104px; bottom: 98px; width: 68px; height: 68px; border-color: var(--paper); }
#btn-smoke { right: 22px; bottom: 122px; width: 68px; height: 68px; border-color: var(--muted); }
.pad button.on { background: var(--pipe); }
.pad button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
@media (pointer: coarse) {
  .pad { display: block; }
  .keys { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Gnome <span>Delivery</span> Service</h1>
  <p class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows move · <kbd>Space</kbd> dash · <kbd>X</kbd> whack · <kbd>C</kbd> paper wrap · <kbd>V</kbd> smoke · <kbd>Q</kbd> swap smoke · <kbd>F</kbd> accept order · <kbd>Enter</kbd> continue</p>
</header>
<div class="stage" id="stage">
  <canvas id="view" aria-label="Gnome Delivery Service game"></canvas>
  <canvas id="hud"></canvas>
  <div class="pad">
    <div class="stick" id="stick" role="group" aria-label="Move"><i></i></div>
    <button type="button" id="btn-whack" data-key="attack">Whack</button>
    <button type="button" id="btn-jump" data-key="jump">Dash</button>
    <button type="button" id="btn-wrap" data-key="wrap">Wrap</button>
    <button type="button" id="btn-smoke" data-key="smoke">Smoke</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
